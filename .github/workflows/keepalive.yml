name: Keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acordar API do Método OAB
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
            "https://metodo-oab-api.onrender.com/api/health" || true)
          echo "HTTP $code"
